
vector:
  fullnameOverride: syslog-relay

  role: Aggregator
  replicas: 1

  image:
    repository: docker.io/timberio/vector
    pullPolicy: IfNotPresent

  logLevel: info

  # Resource allocation
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Persistent storage for disk buffer
  persistence:
    enabled: true
    size: 5Gi
    accessModes:
      - ReadWriteOnce
    retentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain

  # Vector configuration
  customConfig:
    data_dir: /vector-data-dir

    sources:
      syslog_udp:
        type: socket
        mode: udp
        address: "0.0.0.0:1514"
        decoding:
          codec: bytes

    sinks:
      remote_syslog:
        type: socket
        inputs:
          - syslog_udp

        address: "syslog-nap.please-protect.com:30140"
        mode: udp

        framing:
          method: bytes

        encoding:
          codec: raw_message

        buffer:
          type: disk
          max_size: 1073741824
          when_full: block

  # Container ports
  containerPorts:
    - name: syslog-udp
      containerPort: 1514
      protocol: UDP

  # Kubernetes Service
  service:
    enabled: true
    type: NodePort

    ports:
      - name: syslog-udp
        port: 514
        targetPort: 1514
        nodePort: 30140
        protocol: UDP

  serviceHeadless:
    enabled: false

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false
