apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snipeit-ing
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP  
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - {{ .Values.domain1 }}
      - {{ .Values.domain2 }}
  rules:
    - host: {{ .Values.domain1 }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: snipeit-main
                port:
                  number: 80
  
    - host: {{ .Values.domain2 }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: snipeit-main
                port:
                  number: 80
